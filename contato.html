<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato — Timãodle</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="main-wrapper">
        <div class="legal-page">
            <a href="index.html" class="nav-btn legal-back">⬅ Voltar</a>

            <h1>Fale Conosco</h1>
            <p class="legal-updated">Sugestões, reclamações ou bugs — manda pra gente.</p>

            <form class="contact-form" id="contactForm">
                <div class="form-field">
                    <label for="tipo">Assunto</label>
                    <select id="tipo" name="tipo" required>
                        <option value="Sugestão">Sugestão</option>
                        <option value="Reclamação">Reclamação</option>
                        <option value="Reportar bug">Reportar bug</option>
                        <option value="Outro">Outro</option>
                    </select>
                </div>

                <div class="form-field">
                    <label for="nome">Nome <span class="optional">(opcional)</span></label>
                    <input type="text" id="nome" name="nome" placeholder="Como podemos te chamar?">
                </div>

                <div class="form-field">
                    <label for="email">E-mail para retorno <span class="optional">(opcional)</span></label>
                    <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com">
                </div>

                <div class="form-field">
                    <label for="mensagem">Mensagem</label>
                    <textarea id="mensagem" name="mensagem"
                        placeholder="Conta com detalhes o que aconteceu, sua ideia, ou o que encontrou de errado..."
                        required></textarea>
                </div>

                <button type="submit" class="form-submit-btn">Enviar mensagem</button>

                <p class="form-note">
                    Ao clicar em enviar, seu aplicativo de e-mail padrão vai abrir com a mensagem já preenchida,
                    pronta pra você mandar. O Timãodle não tem servidor próprio — por isso o envio acontece direto
                    do seu e-mail.
                </p>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('contactForm').addEventListener('submit', function (e) {
            e.preventDefault();

            const tipo = document.getElementById('tipo').value;
            const nome = document.getElementById('nome').value.trim();
            const email = document.getElementById('email').value.trim();
            const mensagem = document.getElementById('mensagem').value.trim();

            if (!mensagem) {
                alert('Escreva sua mensagem antes de enviar.');
                return;
            }

            const subject = encodeURIComponent(`[Timãodle] ${tipo}`);
            const body = encodeURIComponent(
                `Nome: ${nome || '(não informado)'}\n` +
                `E-mail para retorno: ${email || '(não informado)'}\n\n` +
                `Mensagem:\n${mensagem}`
            );

            window.location.href = `mailto:contato@timaodle.net?subject=${subject}&body=${body}`;
        });
    </script>
</body>

</html>
